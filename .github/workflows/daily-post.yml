name: GBP daily post

on:
  schedule:
    # 毎日 07:07 JST（=22:07 UTC）に起動し、下の待機ステップで 09:00 JST まで待ってから投稿。
    # GitHub の schedule は遅延するため（実測で最大3時間超）、早めに起動して着地時刻を安定させる。
    - cron: "7 22 * * *"
  workflow_dispatch: {}

# 投稿ロジックは posts/schedule.json（曜日×週）＋ posts/content.json（テーマ本文）。
# 2026-07-13 起点。開始前の日付・日曜・休診(水:江坂/ラボ)は表側のnullで自動的に投稿なし。
#
# 2026-10-21 再発防止: Public リポジトリは 60 日間コミットが無いと schedule が自動無効化される
# （2026-10-18〜21 に disabled_inactivity で停止した）。毎月1日にハートビートの空コミットを push して
# 60 日カウンタをリセットする。push には contents: write 権限が要る。
permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 09:02 JST まで待機（早く起動した分はここで吸収。手動実行時は待たない）
        if: github.event_name == 'schedule'
        run: |
          target=$(TZ=Asia/Tokyo date -d "09:02" +%s)
          now=$(date +%s)
          if [ "$now" -lt "$target" ]; then
            echo "09:02 JST まで $((target - now)) 秒待機します"
            sleep $((target - now))
          else
            echo "既に 09:02 JST を過ぎているため待機なしで投稿します"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: スケジュール投稿
        env:
          GBP_CLIENT_ID:     ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          LOC_SENRICHUO:     ${{ secrets.LOC_SENRICHUO }}
          LOC_ESAKA:         ${{ secrets.LOC_ESAKA }}
          LOC_MINOH:         ${{ secrets.LOC_MINOH }}
          LOC_LAB:           ${{ secrets.LOC_LAB }}
          IMAGES_BASE_URL:   ${{ secrets.IMAGES_BASE_URL }}
        run: python post_scheduled.py
      - name: 月1ハートビート（毎月1日 JST・定時実行のみ）— 60日無コミットによる schedule 自動無効化を防ぐ
        if: github.event_name == 'schedule' && success()
        run: |
          if [ "$(TZ=Asia/Tokyo date +%d)" != "01" ]; then
            echo "1日ではないためハートビートなし"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "heartbeat: $(TZ=Asia/Tokyo date +%Y-%m-%d) 定時実行の自動無効化防止（空コミット）"
          git push origin HEAD:main
