name: Campaign 8/9 (夏季休暇のお知らせ) 単発・2026年限定

# 2026-08-09 09:00 JST の投稿：4拠点に夏季休暇(8/9〜8/16)のお知らせを投稿。
# 日曜のため通常は休診日チェックでスキップされるが、IGNORE_CLOSED=1 で強制配信。
# 日替わり投稿は posts/closures.json の夏季休暇2026エントリ(8/9〜8/16)でスキップ済み。
# 【重要】休暇日程は毎年変わるため、この投稿は2026年限定。実行後・または2027年になる前に
# このワークフローファイルと posts/campaign_0809_summer.json は削除すること（自動再発火させない）。
on:
  schedule:
    - cron: "0 0 9 8 *"     # 毎年8月9日 00:00 UTC = 09:00 JST（対象は2026/8/9のみ）
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 8/9投稿（夏季休暇のお知らせ・全拠点）
        env:
          GBP_CLIENT_ID:     ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          LOC_SENRICHUO:     ${{ secrets.LOC_SENRICHUO }}
          LOC_ESAKA:         ${{ secrets.LOC_ESAKA }}
          LOC_MINOH:         ${{ secrets.LOC_MINOH }}
          LOC_LAB:           ${{ secrets.LOC_LAB }}
          IMAGES_BASE_URL:   ${{ secrets.IMAGES_BASE_URL }}
          IGNORE_CLOSED:     "1"
        run: python post_campaign.py posts/campaign_0809_summer.json
