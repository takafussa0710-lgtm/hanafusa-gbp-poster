name: campaign-post
# 手動起動のキャンペーン投稿。posts/campaign_*.json を指定して post_campaign.py を実行する(2026-10-27 追加)。
# 起動例: gh workflow run campaign.yml -f file=posts/campaign_miradry_autumn_winter.json
on:
  workflow_dispatch:
    inputs:
      file:
        description: "投稿JSON(posts/campaign_xxx.json)"
        required: true
        default: "posts/campaign.json"
      ignore_closed:
        description: "定休日チェックを無視する(1=無視)"
        required: false
        default: "0"
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: キャンペーン投稿
        env:
          GBP_CLIENT_ID:     ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          LOC_SENRICHUO:     ${{ secrets.LOC_SENRICHUO }}
          LOC_ESAKA:         ${{ secrets.LOC_ESAKA }}
          LOC_MINOH:         ${{ secrets.LOC_MINOH }}
          LOC_LAB:           ${{ secrets.LOC_LAB }}
          IMAGES_BASE_URL:   ${{ secrets.IMAGES_BASE_URL }}
          IGNORE_CLOSED:     ${{ github.event.inputs.ignore_closed }}
        run: python post_campaign.py "${{ github.event.inputs.file }}"
